spring.application.name=carlosDiaz

# Credenciales de la base de datos

# Nombre de la base de datos
spring.datasource.url=${DB_URL}
# --------------------------------
# Usuario de la base de datos
spring.datasource.username=${DB_USERNAME}

# Contraseña del usuario de la base de datos
spring.datasource.password=${DB_PASSWORD}

# Configuración de la conexión a la base de datos
spring.datasource.driver-class-name=org.postgresql.Driver

# Mostrar por consola los sql ejecutados
spring.jpa.show-sql=true

# Importante pasar a update una vez creada la base de datos
spring.jpa.hibernate.ddl-auto=none

spring.thymeleaf.cache=false
logging.level.org.thymeleaf=DEBUG

# Habilitar los mapeos de recursos estáticos para Swagger UI
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Configuración de la ruta de la documentacion en Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html